# Pop!_OS package selection.
# Lines beginning with "#" are skipped. Uncomment what you want to install.
# apt sections use apt-get. If a selected apt package is missing on your Pop!_OS
# release, install.sh skips it and prints a summary at the end.
# external/npm/cargo sections use their own installers and require network access.

