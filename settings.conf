# Optional machine-level settings.
# Empty/commented values are skipped.

# Apt mirror. Supports classic sources.list and Ubuntu/Pop!_OS deb822 sources.
# The original source file is backed up before it is changed.
APT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/ubuntu

# Python pip mirror.
PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn

# npm registry. Leave empty to keep npmjs.org.
# NPM_REGISTRY=https://registry.npmmirror.com

# Rust mirrors. Useful in China, skipped unless uncommented.
# RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
# RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
# CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

# Conda mirrors, applied only if conda exists.
# CONDA_USE_TUNA=1

# Git commit identity and GitHub transport.
GIT_USER_NAME="yangyuchen"
GIT_USER_EMAIL=yangyuchen@dreame.tech
# Use https until this machine has an SSH key registered with GitHub.
GIT_GITHUB_PROTOCOL=https
# Generate ~/.ssh/id_ed25519 when no existing SSH public key is found.
GENERATE_GITHUB_SSH_KEY=1

# First-run initialization.
NVIM_LAZY_SYNC=1
