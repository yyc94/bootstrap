# Optional machine-level settings.
# Empty/commented values are skipped.

# Apt mirror. For Pop!_OS this rewrites only Ubuntu entries in /etc/apt/sources.list
# when that file exists. It backs up the old file first.
# APT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/ubuntu

# Python pip mirror.
PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
PIP_TRUSTED_HOST=pypi.tuna.tsinghua.edu.cn

# npm registry. Leave empty to keep npmjs.org.
# NPM_REGISTRY=https://registry.npmmirror.com

# Rust mirrors. Useful in China, skipped unless uncommented.
# RUSTUP_DIST_SERVER=https://mirrors.tuna.tsinghua.edu.cn/rustup
# RUSTUP_UPDATE_ROOT=https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup
# CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse

# Conda mirrors, applied only if conda exists.
# CONDA_USE_TUNA=1

# Git identity. Leave empty on machines that should not use work identity.
# GIT_USER_NAME="Your Name"
# GIT_USER_EMAIL=you@example.com

# First-run initialization.
NVIM_LAZY_SYNC=1
